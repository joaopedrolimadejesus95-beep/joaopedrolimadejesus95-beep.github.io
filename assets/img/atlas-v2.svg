      <text x="64" y="30" text-anchor="middle" fill="#34D399" class="mono" font-size="11" font-weight="700">✓ DEFENDIDO</text>
      <rect x="122" y="14" width="78" height="24" rx="6" fill="none" stroke="#27272A" />
      <circle cx="136" cy="26" r="3.5" fill="#EF4444" />
      <text x="166" y="30" text-anchor="middle" fill="#A1A1AA" class="mono" font-size="11">Crítica</text>
