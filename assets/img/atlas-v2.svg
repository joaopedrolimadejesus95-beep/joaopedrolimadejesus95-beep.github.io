      <rect x="18" y="14" width="92" height="24" rx="6" fill="#06281E" stroke="#10B981" stroke-opacity="0.4" />
      <text x="64" y="30" text-anchor="middle" fill="#34D399" class="mono" font-size="11" font-weight="700">✓ DEFENDIDO</text>
      <rect x="122" y="14" width="78" height="24" rx="6" fill="none" stroke="#27272A" />
      <circle cx="136" cy="26" r="3.5" fill="#EF4444" />
      <text x="166" y="30" text-anchor="middle" fill="#A1A1AA" class="mono" font-size="11">Crítica</text>
      <text x="218" y="31" fill="#FAFAFA" class="sans" font-size="14" font-weight="600">8. XSS Armazenado no Nome do Cliente via Cardápio Público</text>
      <text x="1142" y="31" text-anchor="end" fill="#71717A" class="mono" font-size="14">▸</text>
