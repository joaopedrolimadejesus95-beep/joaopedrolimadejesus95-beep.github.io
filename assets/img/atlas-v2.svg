      <!-- Side-by-Side Expected vs Obtained Grid -->
      <rect x="20" y="124" width="1128" height="104" rx="8" fill="#0D0D10" stroke="#1F1F23" stroke-width="1" />
      <line x1="584" y1="124" x2="584" y2="228" stroke="#1F1F23" stroke-width="1" />

      <text x="40" y="150" fill="#71717A" class="mono" font-size="10.5" font-weight="700" letter-spacing="0.8">COMPORTAMENTO ESPERADO (DEFESA)</text>
      <text x="40" y="176" fill="#D4D4D8" class="sans" font-size="13">O backend deve ignorar o preço sugerido pelo LLM e recalcular o</text>
      <text x="40" y="196" fill="#D4D4D8" class="sans" font-size="13">total exclusivamente a partir do catálogo real no PostgreSQL.</text>

      <text x="604" y="150" fill="#34D399" class="mono" font-size="10.5" font-weight="700" letter-spacing="0.8">RESULTADO OBTIDO (GROUND TRUTH NO BANCO)</text>
